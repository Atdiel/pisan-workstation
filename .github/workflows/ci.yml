name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci
        env:
          # El CI solo compila renderer/main; no necesita el binario de Electron.
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npx vite build
        env:
          VITE_API_URL: https://example.invalid
